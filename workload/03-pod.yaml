apiVersion: v1
kind: Pod
metadata:
  name: af-alg-workload
  namespace: af-alg-workload
  annotations:
    kubernetes.io/description: AF_ALG socket validation workload.
    openshift.io/required-scc: restricted-v2
  labels:
    app: af-alg-workload
spec:
  restartPolicy: Never
  containers:
  - name: workload
    image: registry.access.redhat.com/ubi9/python-39:latest
    command: ["python3", "/scripts/af_alg_workload.py"]
    volumeMounts:
    - name: script
      mountPath: /scripts
      readOnly: true
  volumes:
  - name: script
    configMap:
      name: af-alg-workload-script
